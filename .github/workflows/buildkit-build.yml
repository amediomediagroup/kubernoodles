name: 🧪 Build with BuildKit

on:
  push:
    branches: [feat/build-kit]
  workflow_dispatch:
    inputs:
      image_name:
        description: 'Override image name (leave empty for matrix)'
        default: ''
      dockerfile:
        description: 'Override Dockerfile path (leave empty for matrix)'
        default: ''
      context:
        description: 'Git context'
        default: ''
      platforms:
        description: 'Comma-separated target platforms'
        default: 'linux/amd64,linux/arm64'
      extra_tags:
        description: 'Additional tags (comma-separated)'
        default: ''

env:
  BUILDKITD_FLAGS: --rootless --oci-worker-no-process-sandbox
  BUILDKIT_OCI_EXECUTOR: no-process-sandbox
  REGISTRY: ghcr.io
  CONTEXT: ${{ inputs.context || format('https://github.com/{0}.git#refs/heads/feat/build-kit', github.repository) }}
  http_proxy: http://squid.arc-proxy.svc.cluster.local:3128
  https_proxy: http://squid.arc-proxy.svc.cluster.local:3128
  no_proxy: 10.43.0.1,10.42.0.0/16,192.168.0.0/16,.svc.cluster.local,localhost,127.0.0.1

jobs:
  build:
    container:
      image: moby/buildkit:rootless
    runs-on: gha-k8s-runners
    permissions:
      attestations: write
      contents: write
      packages: write
      security-events: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: wolfi-squid
            image: amediomediagroup/kubernoodles/wolfi-squid
            dockerfile: images/wolfi.squid.Dockerfile
          - name: alpine-squid
            image: amediomediagroup/kubernoodles/squid
            dockerfile: images/alpine.squid.Dockerfile
          - name: arc-runner
            image: amediomediagroup/kubernoodles/arc-runner
            dockerfile: images/arc-runner.Dockerfile
          - name: kaniko-build-test
            image: amediomediagroup/kubernoodles/kaniko-build
            dockerfile: images/kaniko-build-test.Dockerfile
          - name: buildkit-tools
            image: amediomediagroup/kubernoodles/buildkit-tools
            dockerfile: images/buildkit-tools.Dockerfile

    steps:
      - name: Generate all tags
        id: tags
        shell: sh
        run: |
          IMG="${{ inputs.image_name || matrix.target.image }}"
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BRANCH=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          ALL_TAGS="test $BRANCH sha-$SHA ${{ inputs.extra_tags }}"
          NAMES=""
          for TAG in $ALL_TAGS; do
            [ -z "$TAG" ] && continue
            [ -n "$NAMES" ] && NAMES="${NAMES},"
            NAMES="${NAMES}$REGISTRY/$IMG:$TAG"
          done
          echo "names=$NAMES" >> $GITHUB_OUTPUT
          PREFIX=$(echo "$IMG" | sed 's/:[^:]*$//')
          echo "CACHE_REF=$REGISTRY/$PREFIX:buildcache" >> $GITHUB_OUTPUT

      - name: Resolve dockerfile
        id: df
        shell: sh
        run: |
          DF="${{ inputs.dockerfile || matrix.target.dockerfile }}"
          echo "path=$DF" >> $GITHUB_OUTPUT

      - name: Set up GHCR auth for buildkit
        shell: sh
        run: |
          mkdir -p /run/user/1000 /tmp/.docker
          AUTH=$(echo -n "trucpd:${{ secrets.GITHUB_TOKEN }}" | base64 | tr -d '\n')
          echo "{\"auths\":{\"ghcr.io\":{\"auth\":\"$AUTH\"}}}" > /tmp/.docker/config.json
          echo "DOCKER_CONFIG=/tmp/.docker" >> $GITHUB_ENV
          echo "XDG_RUNTIME_DIR=/run/user/1000" >> $GITHUB_ENV

      - name: Build multi-arch + push all tags
        id: build
        shell: sh
        run: |
          CACHE_REF="${{ steps.tags.outputs.CACHE_REF }}"
          CACHE_ARGS="--export-cache type=registry,ref=$CACHE_REF,mode=max"
          TOKEN=$(echo -n "trucpd:${{ secrets.GITHUB_TOKEN }}" | base64 | tr -d '\n')
          if wget -qO- --method=HEAD --header="Authorization: Bearer $TOKEN" \
            "https://ghcr.io/v2/${{ matrix.target.image }}/manifests/buildcache" 2>/dev/null; then
            CACHE_ARGS="$CACHE_ARGS --import-cache type=registry,ref=$CACHE_REF"
          fi
          buildctl-daemonless.sh build \
            --frontend dockerfile.v0 \
            --opt context=$CONTEXT \
            --opt filename=${{ steps.df.outputs.path }} \
            --opt platform=${{ inputs.platforms || 'linux/amd64,linux/arm64' }} \
            --opt build-arg:http_proxy=http://squid.arc-proxy.svc.cluster.local:3128 \
            --opt build-arg:https_proxy=http://squid.arc-proxy.svc.cluster.local:3128 \
            --opt build-arg:no_proxy=10.43.0.1,10.42.0.0/16,192.168.0.0/16,.svc.cluster.local,localhost,127.0.0.1 \
            $CACHE_ARGS \
            --output type=image,\"name=${{ steps.tags.outputs.names }}\",push=true 2>&1 | tee /tmp/buildctl.log

      - name: Get digest
        shell: sh
        run: |
          wget -Y off -qO- "https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_x86_64.tar.gz" | tar -xz crane
          FIRST_TAG=$(echo "${{ steps.tags.outputs.names }}" | cut -d, -f1)
          ./crane digest "$FIRST_TAG" > ${{ github.workspace }}/digest.txt

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.target.name }}
          path: ${{ github.workspace }}/digest.txt
          if-no-files-found: error

  verify:
    needs: build
    container:
      image: ubuntu:24.04
    runs-on: gha-k8s-runners
    permissions:
      attestations: write
      contents: write
      packages: write
      security-events: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: wolfi-squid
            image: amediomediagroup/kubernoodles/wolfi-squid
          - name: alpine-squid
            image: amediomediagroup/kubernoodles/squid
          - name: arc-runner
            image: amediomediagroup/kubernoodles/arc-runner
          - name: kaniko-build-test
            image: amediomediagroup/kubernoodles/kaniko-build
          - name: buildkit-tools
            image: amediomediagroup/kubernoodles/buildkit-tools

    steps:
      - name: Download digest artifact
        uses: actions/download-artifact@v4
        with:
          name: digest-${{ matrix.target.name }}

      - name: Set image reference
        id: ref
        run: |
          DIGEST="$(cat ${{ github.workspace }}/digest.txt)"
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "IMAGE=ghcr.io/${{ matrix.target.image }}" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        id: attest
        with:
          subject-name: ${{ steps.ref.outputs.IMAGE }}
          subject-digest: ${{ steps.ref.outputs.digest }}
          push-to-registry: true

      - name: Scan with Grype
        uses: anchore/scan-action@7037fa011853d5a11690026fb85feee79f4c946c # v7.3.2
        id: scan
        continue-on-error: true
        with:
          image: ${{ steps.ref.outputs.IMAGE }}@${{ steps.ref.outputs.digest }}
          fail-build: false

      - name: Upload scan results (SARIF)
        uses: github/codeql-action/upload-sarif@c793b717bc78562f491db7b0e93a3a178b099162 # v3.29.5
        if: always()
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}

      - name: Generate SBOM
        uses: anchore/sbom-action@17ae1740179002c89186b61233e0f892c3118b11 # v0.23.0
        continue-on-error: true
        with:
          image: ${{ steps.ref.outputs.IMAGE }}@${{ steps.ref.outputs.digest }}
          artifact-name: ${{ matrix.target.name }}-${{ github.sha }}.sbom

      - name: Install cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Log in to GHCR for cosign
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | cosign login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Sign the image with Cosign
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cosign sign --yes "${{ steps.ref.outputs.IMAGE }}@${{ steps.ref.outputs.digest }}"
