name: 📦 Publish buildkit-ns image

on:
  workflow_dispatch:
  push:
    branches: [feat/build-kit]
    paths:
      - 'images/buildkit-ns.Dockerfile'

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: images/buildkit-ns.Dockerfile
          push: true
          tags: ghcr.io/amediomediagroup/kubernoodles/buildkit-ns:latest
